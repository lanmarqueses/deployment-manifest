apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: Always
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh","-c"]
          args:
            - |
              echo "Setting permissions on /var/opt/mssql/data...";
              mkdir -p /var/opt/mssql/data;
              chown -R 10001:0 /var/opt/mssql/data || true;
              chmod -R g+rwX /var/opt/mssql/data || true;
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql/data
      volumes:
        - name: mssql-data
          persistentVolumeClaim:
            claimName: mssql-data
      containers:
        - name: sql
          image: mcr.microsoft.com/azure-sql-edge
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              value: "P@ssw0rd123"
            - name: MSSQL_PID
              value: "Developer"
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql/data
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: app
spec:
  selector:
    app: db
  ports:
    - port: 1433
      targetPort: 1433
