apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ess-web
  namespace: app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: web.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
    - host: api.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
