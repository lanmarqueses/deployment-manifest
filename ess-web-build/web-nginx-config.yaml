apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-conf
  namespace: app
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      include /etc/nginx/mime.types;
      add_header Content-Disposition "inline" always;

      # Serve SPA: existing files first, else index.html
      location / {
        try_files $uri $uri/ /index.html;
      }

      # Don’t rewrite asset paths to index; 404 if missing
      location /static/ { try_files $uri =404; }
      location /styles/ { try_files $uri =404; }
      location /utils/  { try_files $uri =404; }

      # Any common static asset extension: never rewrite to index
      location ~* \.(?:js|css|map|json|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000";
      }
    }
